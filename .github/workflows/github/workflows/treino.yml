name: treino

on:
  workflow_dispatch:
    inputs:
      adam_iter:
        description: "Iteracoes do Adam"
        default: "5000"
      lbfgs_iter:
        description: "Iteracoes do L-BFGS (multiplo de 50)"
        default: "500"
      seed:
        description: "Semente aleatoria"
        default: "0"

jobs:
  treino:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Treinar o PINN
        env:
          ADAM_ITER: ${{ github.event.inputs.adam_iter }}
          LBFGS_ITER: ${{ github.event.inputs.lbfgs_iter }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          python -m pinn_burgers.train \
            --adam-iter "$ADAM_ITER" --lbfgs-iter "$LBFGS_ITER" --seed "$SEED" \
            --out resultados
          cat resultados/resumo.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: resultados/
